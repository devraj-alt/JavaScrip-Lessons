<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Time Tester</title>
    <link rel="stylesheet" href="rtt.css">
</head>
<body>
    <h2>Reaction Time Tester</h2>
   <div id="card">
    <h3 id="main-text">Click to Start</h3>
    <p id="sub-text">When the box turns green, click as fast as you can.</p>
    <div class="score-board">
        <img src="./img/zap-svgrepo-com.svg" alt="">
        <p>Last Score: <span id="last-score">--</span></p>
        <p>Best Score: <span id="best-score">--</span></p>
        <p>History: <span id="history">None</span></p>
    </div>
</div>
    <script src="rtt.js"></script>
</body>
</html>
